<script>
'use strict';
// ============ 定数 ============
const CHAR_NAME = 'DASH';
const DH = 360, GROUND = 300, B = 36;
const JUMP_T = 0.5, JUMP_H = 2.05 * B;
const V0 = 4 * JUMP_H / JUMP_T, GRAV = 2 * V0 / JUMP_T;
const HOLD_MAX = 0.18, HOLD_GRAV = 0.46;
const JUMP_BUFFER = 0.15;          // 先行入力: タップを覚えておく秒数
const COYOTE = 0.15;               // 足場から落ちはじめて、まだ跳べる秒数
const LEAD = 0.9, TAP_OFFSET = 0.25;
const CEIL = DH - GROUND;          // 重力反転ゾーンの天井位置(上下ミラー対称)
const REVIVE_COST = 50;            // コンティニュー費用(コイン)
let SPEED = 380;

const ORIGINAL_SONGS = ['Asset/stage01.mp3', 'Asset/stage2.mp3', 'Asset/stage03.mp3'];
const SONGS = ['Asset/bgm1.mp3', 'Asset/bgm2.mp3', 'Asset/bgm3.mp3', 'Asset/bgm4.mp3'];
const HUES = [210, 285, 140, 25, 330, 185, 55, 260, 100, 0,
  225, 300, 155, 40, 345, 200, 70, 275, 115, 15];
const LEGACY_NSTAGE = 10;
// Target lengths (s); null plays the whole song. Stages 7-10 use world songs of
// 2-3 minutes, cut on a downbeat so the stages still grow step by step.
const STAGE_LENGTHS = [null, null, null, null, null, null, 30, 34, 37, 40,
  45, 60, 75, 90, 105, 115, 125, 135, null, null];
const NSTAGE = 20;
const STAGES = Array.from({ length: NSTAGE }, (_, i) => ({
  name: 'STAGE ' + (i + 1),
  file: i < LEGACY_NSTAGE ? ORIGINAL_SONGS[i % ORIGINAL_SONGS.length] : SONGS[(i - LEGACY_NSTAGE) % SONGS.length],
  hue: HUES[i],
  speed: i < LEGACY_NSTAGE ? 350 + i * 10 : 450 + (i - LEGACY_NSTAGE) * 6,
  diff: i / (NSTAGE - 1),
  // Target play length in seconds (null = whole song). Stages 1-10 use 23-31s
  // songs; the long songs are cut so stage 11 is not suddenly six times longer.
  length: STAGE_LENGTHS[i] ?? null,
}));
// Where a stage ends: the strongest beat within 3s of its target length, so the
// cut lands on a downbeat. Charts, progress % and the finish gate all use this.
// The goal always sits 0.6s before the audio's own end: a media element can
// stop a few frames short of its reported length, and the goal must still be reached.
const END_MARGIN = 0.6;
function stageEnd(cfg, bts, full) {
  full = Math.max(1, full - END_MARGIN);
  if (!cfg || !cfg.length || cfg.length >= full - 1) return full;
  let best = null;
  for (const b of bts) {
    if (Math.abs(b.t - cfg.length) > 3) continue;
    if (!best || (b.s || 0) > (best.s || 0)) best = b;
  }
  return Math.min(full, best ? best.t : cfg.length);
}

const SKINS = [
  { n: 'RED',    src: 'Asset/world/cast-neon/red.png', need: 0, effect: 'score',  desc: 'PERFECTの得点 +10%' },
  { n: 'BLUE',   src: 'Asset/world/cast-neon/blue.png', need: 1, effect: 'judge',  desc: 'タイミング判定がやさしく' },
  { n: 'PINK',   src: 'Asset/world/cast-neon/pink.png', need: 3, effect: 'coin',   desc: 'コインを引き寄せる' },
  { n: 'GREEN',  src: 'Asset/world/cast-neon/green.png', need: 5, effect: 'hold',   desc: '長押しジャンプを強化' },
  { n: 'PURPLE', src: 'Asset/world/cast-neon/purple.png', need: 7, effect: 'shield', desc: 'ミスを1回ガード' },
];

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const app = document.getElementById('app');
const coinImg = new Image();
// The coin source is 512px but is drawn at 12-24px for every visible coin each
// frame. Downscaling it once keeps per-frame draws cheap; coinSprite is the
// image to draw, and stays the original until the small copy exists.
let coinSprite = coinImg;
function bakeCoin() {
  if (!coinImg.complete || !coinImg.naturalWidth) return;
  try {
    // 1.5x the largest drawn size (24 css px) in device pixels, never above the source.
    const size = Math.min(coinImg.naturalWidth, Math.ceil(24 * SC * 1.5));
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
    g.drawImage(coinImg, 0, 0, size, size); coinSprite = c;
  } catch (e) { coinSprite = coinImg; }
}
coinImg.onload = bakeCoin;
coinImg.src = 'Asset/cosmo-coin.png';
let W = 640, SC = 1;
// Backing-store resolution cap. This was min(dpr, 2) until commit de95037,
// which lowered it to 1.5 on touch devices with no recorded reason, in the same
// commit that rewrote audio. On an iPhone (devicePixelRatio 3) a 1.5 cap renders
// at half the native linear resolution and is then upscaled, which is the
// straightforward explanation for a soft, aliased image - and it is made worse
// again by screen-recording re-encode.
// Raising it costs fill rate, so it is overridable for device A/B without a
// rebuild:  localStorage.setItem('rdash_dpr_cap','1.5'); resize();
const DPR_CAP = 2, CANVAS_PIXEL_BUDGET = 1.8e6;
function dprCap() {
  // ?dpr=1.5 wins over the stored value, so the cap can be A/B'd on a phone
  // with no debugger attached.
  const q = parseFloat(new URLSearchParams(location.search).get('dpr'));
  if (Number.isFinite(q) && q > 0) return q;
  let v = NaN;
  try { v = parseFloat(localStorage.getItem('rdash_dpr_cap')); } catch (e) {}
  return Number.isFinite(v) && v > 0 ? v : DPR_CAP;
}
// 縦持ちでも常に横画面: 縦のときは画面全体を90度回転して表示する
function resize() {
  const portrait = innerHeight > innerWidth;
  const w = portrait ? innerHeight : innerWidth;
  const h = portrait ? innerWidth : innerHeight;
  app.style.width = w + 'px'; app.style.height = h + 'px';
  app.style.transform = portrait ? 'rotate(90deg) translateY(-100%)' : 'none';
  // Big screens (iPad) are capped by pixel count too: 2x of a 1180x820 iPad is
  // ~3.9M pixels a frame, three times an iPhone's, and it stuttered. Keep the
  // canvas near an iPhone's load (~1.8M px); the DOM art stays at full sharpness.
  const dpr = Math.min(devicePixelRatio || 1, dprCap(), Math.max(1, Math.sqrt(CANVAS_PIXEL_BUDGET / (w * h))));
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.style.top = '0px';
  cv.width = w * dpr; cv.height = h * dpr;
  SC = cv.height / DH; W = cv.width / SC;
  // Menus and dialogs are laid out for a phone in landscape (~844x390). On a
  // bigger screen (iPad) they scale up with it instead of floating tiny in the
  // middle; the game canvas already scales on its own.
  const uiz = Math.max(1, Math.min(1.7, Math.min(w / 844, h / 390)));
  document.documentElement.style.setProperty('--uiz', uiz.toFixed(3));
  document.documentElement.classList.toggle('big-screen', uiz > 1.05);
}
addEventListener('resize', resize);
addEventListener('resize', () => bakeCoin());
addEventListener('orientationchange', () => setTimeout(resize, 100));
resize();

const $ = id => document.getElementById(id);
// Toasts are glowing badges: coin (+N, gold), warn (red: something failed or is missing), info (cyan).
const TOAST_WARN = /できません|できなかった|足りません|中止|読み込め|もう一度タップ|0\/3|進めると解放|または/;
function toast(msg, type) {
  const t = $('toast'), text = String(msg);
  type = type || (/^\+\d/.test(text) ? 'coin' : TOAST_WARN.test(text) ? 'warn' : 'info');
  const lead = /^(✓|♪)\s*/.exec(text);
  const icon = type === 'coin' ? '<img src="Asset/cosmo-coin.png" alt="">' : type === 'warn' ? '!' : lead ? lead[1] : '✓';
  t.className = 'toast-' + type;
  t.innerHTML = `<i aria-hidden="true">${icon}</i><span></span>`;
  t.querySelector('span').textContent = lead ? text.slice(lead[0].length) : text;
  t.style.display = 'flex';
  t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop');
  clearTimeout(toast._id); toast._id = setTimeout(() => t.style.display = 'none', 2200);
}

// 進捗を加算(isMax=true なら最大値更新)し、達成したら即コイン付与
function mission(id, val, isMax) {
  if(window.cosmiiTutorial?.active)return;
  initMissions();
  const m = missions.find(x => x.id === id);
  if (!m) return;
  const p = missionProg[id] || { v: 0, c: false };
  if (p.c) return;
  p.v = isMax ? Math.max(p.v, val) : p.v + val;
  missionProg[id] = p;
  if (p.v >= m.target) {
    p.c = true;
    addCoins(m.reward);
    gaCoins('Source', m.reward, 'Mission', m.id);
    gaDesign('Mission:Complete:' + m.id, m.reward);
    window.gameUI?.notifyMission(m);
    missionSave();
  }
  missionProg[id] = p;
}

const skinCache = {};
const skinRawCache = {};
function skinSprite(idx) {

}
function skinImage(idx) {

// toDataURL() PNG-encodes the sprite; the menu asks for these ~14 times per
// refresh, so encode each sprite once.
const skinUrlCache = {};
function skinImageUrl(idx) {
  const sp = skinSprite(idx);
  if (!sp) return (SKINS[idx] && SKINS[idx].src) || '';
  return skinUrlCache[idx] || (skinUrlCache[idx] = sp.toDataURL());

function drawSkin(ctx, idx, x, y, w, h) {

}
function trimSprite(img) {
  const S = 256, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const fit = S / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height);
  const iw = (img.naturalWidth || img.width) * fit, ih = (img.naturalHeight || img.height) * fit;
  g.drawImage(img, (S-iw)/2, (S-ih)/2, iw, ih);
  const id = g.getImageData(0, 0, S, S), d = id.data;
  let cr = 0, cg = 0, cb = 0, cn = 0;
  for (const [ox, oy] of [[0,0],[S-4,0],[0,S-4],[S-4,S-4]])
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
      const i = ((oy+y)*S + ox+x)*4; cr += d[i]; cg += d[i+1]; cb += d[i+2]; cn++;
    }
  cr /= cn; cg /= cn; cb /= cn;
  let ca = 0;
  for (const [ox, oy] of [[0,0],[S-4,0],[0,S-4],[S-4,S-4]])
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) ca += d[(((oy+y)*S + ox+x)*4)+3];
  ca /= cn;
  if (ca >= 40) {
    // 不透明背景の画像だけ色ベースのフラッドフィルで背景を除去。
    // 既に透過済みの画像でこれをやると、透明部(RGB=0)から黒い輪郭線を侵食してしまう。
    const TH = 130 * 130;
    const near = i => { const dr = d[i]-cr, dg = d[i+1]-cg, db = d[i+2]-cb; return dr*dr+dg*dg+db*db < TH; };
    const vis = new Uint8Array(S*S), st = [];
    for (let x = 0; x < S; x++) st.push(x, (S-1)*S + x);
    for (let y = 0; y < S; y++) st.push(y*S, y*S + S - 1);
    while (st.length) {
      const p = st.pop();
      if (vis[p] || !near(p*4)) continue;
      vis[p] = 1;
      const x = p % S, y = (p - x) / S;
      if (x > 0) st.push(p-1); if (x < S-1) st.push(p+1);
      if (y > 0) st.push(p-S); if (y < S-1) st.push(p+S);
    }
    for (let p = 0; p < S*S; p++) if (vis[p]) d[p*4+3] = 0;
    g.putImageData(id, 0, 0);
  }
  // アルファでトリミング(透過済み画像はここだけ通る)
  let minx = S, miny = S, maxx = 0, maxy = 0;
  for (let p = 0; p < S*S; p++) {
    if (d[p*4+3] > 8) { const x = p % S, y = (p-x)/S;
      if (x < minx) minx = x; if (x > maxx) maxx = x;
      if (y < miny) miny = y; if (y > maxy) maxy = y; }
  }
  if (maxx < minx || maxy < miny) return c;
  const bw = maxx-minx+1, bh = maxy-miny+1;
  const target = 232;
  const scale = target / Math.max(bw, bh);
  const dw = bw * scale, dh = bh * scale;
  const c2 = document.createElement('canvas');
  c2.width = c2.height = S;
  c2.getContext('2d').drawImage(g.canvas, minx, miny, bw, bh, (S-dw)/2, (S-dh)/2, dw, dh);
  return c2;
}

// Audio playback lives in html-audio.js; beat maps are prepared offline.

function mulberry32(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// ============ 障害物の定義表 ============
// One entry per obstacle type; adding a type (or a stage gimmick) means adding a
// row here rather than editing buildLevel, collision and drawing separately.
//   parts(cx, gy, f): spikes/blocks for collision and drawing. cx = centre x,
//                     gy = top of the one-block band, f = on the ceiling (flip zone)
//   unlock:    difficulty from which the chart may use it as a silhouette (in order)
//   gapAfter:  extra time kept clear after it (s); silhouettes use .85 - minGap
//   highCoin:  the coin over it sits higher, plus a risky bonus coin
//   nearMiss:  passing just over it scores NEAR!
// Stage gimmicks (stage-gimmicks.js) add rows that may also use:
//   parts(cx, gy, f, ob, d) with d = seconds until the player reaches it, and may
//                     return hazards (deadly boxes) and pits (deadly floor) too
//   offset(ob, d):    x distance from the player in px, for obstacles that move
//   draw(ctx, ob, parts, hue): own drawing instead of the default spikes/blocks
//   free:             not a note - not judged, never a MISS (e.g. "stay low")
//   span(ob):         extra seconds the obstacle reaches either side of ob.t
const OBSTACLES = {
  spike:  { nearMiss: true,
    parts: (cx, gy, f) => ({ spikes: [{ x: cx-B/2, y: gy, w: B, h: B, f }], blocks: [] }) },
  spike2: { nearMiss: true, gapAfter: 0.15,
    parts: (cx, gy, f) => ({ spikes: [{ x: cx-B, y: gy, w: B, h: B, f }, { x: cx, y: gy, w: B, h: B, f }], blocks: [] }) },
  block:  {
    parts: (cx, gy, f) => ({ spikes: [], blocks: [{ x: cx-B/2, y: gy, w: B, h: B, f }] }) },
  block2: { gapAfter: 0.15, highCoin: true,
    parts: (cx, gy, f) => ({ spikes: [], blocks: [{ x: cx-B, y: gy, w: B*2, h: B, f }] }) },
  hold:   { gapAfter: 0.15, highCoin: true,
    parts: (cx, gy, f) => ({ spikes: [], blocks: [{ x: cx-B*0.75, y: gy, w: B*1.5, h: B, f }] }) },
  tower:  { unlock: 0.2, silhouette: true, highCoin: true,
    parts: (cx, gy, f) => ({ spikes: [], blocks: [{ x: cx-B/2, y: f ? CEIL : GROUND-B*1.65, w: B, h: B*1.65, f }] }) },
  steps:  { unlock: 0.4, silhouette: true, highCoin: true,
    parts: (cx, gy, f) => ({ spikes: [], blocks: [{ x: cx-B, y: gy, w: B, h: B, f }, { x: cx, y: f ? CEIL : GROUND-B*1.65, w: B, h: B*1.65, f }] }) },
  spike3: { unlock: 0.6, silhouette: true, highCoin: true,
    parts: (cx, gy, f) => ({ spikes: [-1.5, -.5, .5].map(n => ({ x: cx+B*n, y: gy, w: B, h: B, f })), blocks: [] }) },
  bridge: { unlock: 0.8, silhouette: true, highCoin: true,
    parts: (cx, gy, f) => ({ spikes: [], blocks: [{ x: cx-B*1.5, y: gy, w: B*3, h: B, f }] }) },
};
const SILHOUETTES = Object.keys(OBSTACLES).filter(k => OBSTACLES[k].unlock !== undefined);
const obSpan = ob => ob.span || 0;
const obNear = (ob, sec) => Math.abs(ob.t - songPos) <= sec + obSpan(ob);
const isFreeNote = ob => !!(ob.free || OBSTACLES[ob.type]?.free);
// Score/coin multiplier from a stage gimmick (the chorus highlight doubles).
const gimmickMult = () => window.stageGimmicks?.mult() || 1;
const judgeableCount = () => level.reduce((n, ob) => n + (isFreeNote(ob) ? 0 : 1), 0);

// ビート列 → 障害物列(難易度でギャップ・種類・密度を調整)
function buildLevel(beats, duration, seed, diff, gimmick = null) {
  const rng = mulberry32(seed * 1337 + 7);
  const ss = beats.map(o => o.s).sort((x, y) => x - y);
  const dropThr = ss[Math.floor(ss.length * 0.35 * (1 - diff))] || 0;
  const strong = ss[Math.floor(ss.length * 0.8)] || 1;
  const minGap = 0.66 - 0.24 * diff;
  const obs = [];
  let last = -10;
  let phrase = 0;
  let burst = 0;
  for (const o of beats) {
    if (o.t < 2.0 || o.t > duration - 1.2) continue;
    if (o.s < dropThr) continue;
    if (o.t - last < minGap) continue;
    if(diff>=.2&&phrase%5===3&&o.t-last<.85)continue;
    if (burst >= 4 + Math.floor(diff*3) && rng() < 0.5-diff*0.2) { burst = 0; last = o.t + 0.15; continue; }
    const r = rng();
    let type;
    if (diff < 0.15) {
      type = r < 0.7 ? 'spike' : 'block';
    } else {
      const pow = o.s >= strong;
      if (phrase % 8 === 7 && diff > 0.25) type = rng() < 0.55 ? 'block2' : 'spike2';
      else if (pow && r < 0.12 + 0.32 * diff) type = 'spike2';
      else if (diff > 0.38 && r > 0.9) type = 'hold';
      else if (r < 0.58) type = 'spike';
      else if (r < 0.86) type = 'block';
      else type = 'block2';
    }
    // Introduce one silhouette at a time; the first appearance has extra space.
    const choices=SILHOUETTES.filter(k=>diff>=OBSTACLES[k].unlock);
    if(choices.length&&phrase%5===3&&o.t-last>=.85)type=choices[Math.floor(phrase/5)%choices.length];
    // A jump lasts JUMP_T: the next obstacle has to come after landing with
    // real time on the ground (0.1 s; more before a wide one). Back-to-back
    // beats just over JUMP_T apart left ~10 ms to take off again: not playable.
    const wide = type !== 'spike' && type !== 'block';
    if (obs.length && o.t + TAP_OFFSET - obs[obs.length - 1].t < JUMP_T + 0.1 + (wide ? 0.08 : 0)) continue;
    obs.push({ t: o.t + TAP_OFFSET, type });
    phrase++;
    burst++;
    last = o.t + (OBSTACLES[type].silhouette ? .85-minGap : OBSTACLES[type].gapAfter || 0);
  }
  // 重力反転ゾーン: 障害物の広い隙間にポータルを置き、区間内は天井走行になる
  const zones = [];
  if (diff >= 0.25 && obs.length > 8) {
    const nz = diff > 0.6 ? 2 : 1;
    const snapGap = tgt => {
      let bestT = null, bestD = 1e9;
      for (let i = 0; i + 1 < obs.length; i++) {
        if (obs[i+1].t - obs[i].t < 0.9) continue;
        const mid = (obs[i].t + obs[i+1].t) / 2;
        const dd = Math.abs(mid - tgt);
        if (dd < bestD) { bestD = dd; bestT = mid; }
      }
      return bestT;
    };
    for (let k = 0; k < nz; k++) {
      const s0 = snapGap(duration * (0.32 + k * 0.34));
      const e0 = s0 === null ? null : snapGap(s0 + duration * 0.14);
      if (s0 !== null && e0 !== null && e0 - s0 > 3 &&
          (zones.length === 0 || s0 > zones[zones.length-1].end + 2))
        zones.push({ start: s0, end: e0 });
    }
  }
  const portalTimes = [];
  for (const z of zones) portalTimes.push(z.start, z.end);
  // ポータル直前直後は障害物なしの助走スペースにする。
  // After a portal the player first falls to the new floor (~0.42s), so the next
  // tap must come after that: keep 0.75s clear after a portal, 0.45s before it.
  const obsF = obs.filter(o => portalTimes.every(pt => o.t - pt > 0.75 || pt - o.t > 0.45));
  const inZone = t => zones.some(z => t >= z.start && t < z.end);
  // オーブ: 障害物の隙間に置く空中タップ用ボーナス(使わなくてもクリア可能)
  const orbs = [];
  const coins = [];
  if (diff >= 0.15) {
    for (let i = 0; i + 1 < obsF.length; i++) {
      const gap = obsF[i+1].t - obsF[i].t;
      if (gap < 0.6 || gap > 0.95 || rng() >= 0.35) continue;
      const t = obsF[i].t + gap / 2;
      if (!portalTimes.every(pt => Math.abs(t - pt) > 0.5)) continue;
      orbs.push({ t, y: GROUND - B * 2.4 });
      coins.push({ t: t + 0.12, y: GROUND - B * 3.3, risky: true });
      coins.push({ t: t + 0.26, y: GROUND - B * 2.6 });
    }
  }
  // コイン: 障害物の上(ジャンプ頂点)と、障害物のないビート上に配置
  for (const b of obsF) {
    const high = !!OBSTACLES[b.type].highCoin;
    coins.push({ t: b.t, y: GROUND - B/2 - JUMP_H * (high ? 1.18 : 1) });
    if (high) coins.push({ t: b.t + 0.18, y: GROUND - B/2 - JUMP_H * 1.35, risky: true });
  }
  let lastC = -10;
  for (const o of beats) {
    const t = o.t + TAP_OFFSET;
    if (t < 2.0 || t > duration - 1.2) continue;
    if (t - lastC < 0.3) continue;
    if (obsF.some(b => Math.abs(b.t - t) < 0.4)) continue;
    coins.push({ t, y: GROUND - B/2 });
    lastC = t;
  }
  // 反転ゾーン内の収集物は上下ミラー
  for (const c of coins) if (inZone(c.t)) c.y = DH - c.y;
  for (const o of orbs) if (inZone(o.t)) o.y = DH - o.y;
  coins.sort((a, b) => a.t - b.t);
  const built = { obs: obsF, coins, zones, orbs };
  // A stage gimmick reshapes the chart deterministically (its own seeded rng).
  if (gimmick && window.stageGimmicks) window.stageGimmicks.build(built, { beats, duration, seed, diff, gimmick });
  return built;
}

  level = built.obs; coinDefs = built.coins;

  coinsLive = coinDefs.map(c => ({ ...c, got: false }));

// Draw each kind of obstacle of this stage once before the run starts. A first
// draw decodes images and bakes caches (up to ~50ms on a phone): done here, on
// the ready screen, instead of as a hitch in the middle of play.
function prewarmStage() {
  const saved = { level, songPos, state, flipZones };
  try {
    window.worldSkins?.prewarm?.();
    window.stageGimmicks?.prewarm?.();
    window.cosmiiFx?.prewarm(W, DH, B, skinImage(skinIdx));
    markBadge(markWorld());
    const seen = new Set(), sample = [];
    for (const o of level) if (!seen.has(o.type + (o.low === false ? 'h' : '') + (o.c || ''))) { seen.add(o.type + (o.low === false ? 'h' : '') + (o.c || '')); sample.push(o); }
    songPos = 0; state = 'play'; flipZones = [];
    level = sample.map((o, k) => {
      const dt = 0.25 + k * 0.04 - o.t, c = { ...o, t: o.t + dt };
      for (const key of ['from', 'to', 'release', 'fire', 'anchor']) if (typeof c[key] === 'number') c[key] += dt;
      if (c.next) c.next = { ...c.next, t: c.next.t + dt };
      return c;
    });
    draw();
    // ...and upside down, if this stage flips gravity.
    if (saved.flipZones.length) { flipZones = [{ start: -5, end: 5 }]; lastGdir = -1; draw(); lastGdir = 1; }
  } catch (e) { /* warming is best effort */ }
  finally { level = saved.level; songPos = saved.songPos; state = saved.state; flipZones = saved.flipZones; }
}

// ============ リズム判定 ============
function judge() {
  const judgeBoost = skinEffect('judge') ? 1.18 : 1;
  const maxWindow = 0.21 * judgeBoost;
  while (noteJudgeIdx < level.length && level[noteJudgeIdx].t - TAP_OFFSET < songPos - maxWindow)
    noteJudgeIdx++;
  // Skip notes that are never judged (e.g. "stay low under the jellyfish").
  while (noteJudgeIdx < level.length && isFreeNote(level[noteJudgeIdx])) noteJudgeIdx++;
  const prev = level[noteJudgeIdx - 1], next = level[noteJudgeIdx];
  const prevTap = prev ? prev.t - TAP_OFFSET : null;
  const nextTap = next ? next.t - TAP_OFFSET : null;
  // A note that is already judged cannot take this jump; otherwise an early
  // jump for the next note right after a judged one is silently ignored.
  const prevD = prevTap === null || judgedNotes.has(noteJudgeIdx - 1) ? 9 : Math.abs(songPos - prevTap);
  const nextD = nextTap === null ? 9 : Math.abs(nextTap - songPos);
  let d = prevD, hitIdx = noteJudgeIdx - 1;
  if (nextD < prevD) { d = nextD; hitIdx = noteJudgeIdx; }
  if (hitIdx < 0 || judgedNotes.has(hitIdx)) return;
  if (d <= maxWindow) judgedNotes.add(hitIdx);
  const px = player.x + B/2, py = player.y - 14;
  if(skinEffect('judge')&&[.07,.13,.21].some(w=>d>w&&d<=w*judgeBoost))window.beatPSF?.skill('timing');
  if (d <= 0.07 * judgeBoost) {
    if (hitIdx >= noteJudgeIdx) noteJudgeIdx = hitIdx + 1;
    combo++; perfectRun++; maxCombo = Math.max(maxCombo, combo);
    runStats.p++;
    const mult = 1 + Math.floor(Math.min(combo, 60) / 15) * 0.25;
    score += Math.round((130 + combo * 6) * mult * (skinEffect('score') ? 1.1 : 1) * (feverOn ? 2 : 1) * gimmickMult());
    judgeFlash = 'PERFECT';
    window.stageGimmicks?.onJudge('perfect');
    if(skinEffect('score'))window.beatPSF?.skill('score');
    window.cosmiiCharacterMotion?.emit('judge');
    mission('perfect10', 1); mission('combo15', combo, true);
    if (!window.cosmiiImpact?.judge('perfect', px, py, combo)) floats.push({ text: 'PERFECT!', x: px, y: py, l: 1, c: '#ffd94a' }); if(typeof sfxJudge==='function')sfxJudge('perfect',combo);
  } else if (d <= 0.13 * judgeBoost) {
    if (hitIdx >= noteJudgeIdx) noteJudgeIdx = hitIdx + 1;
    combo++; perfectRun = 0; maxCombo = Math.max(maxCombo, combo);
    runStats.g++;
    score += Math.round((85 + combo * 4) * (feverOn ? 2 : 1) * gimmickMult());
    judgeFlash = 'GREAT';
    window.stageGimmicks?.onJudge('great');
    if(skinEffect('judge')) window.cosmiiCharacterMotion?.emit('judge');
    mission('combo15', combo, true);
    if (!window.cosmiiImpact?.judge('great', px, py, combo)) floats.push({ text: 'GREAT', x: px, y: py, l: 1, c: '#7df' }); if(typeof sfxJudge==='function')sfxJudge('great');
  } else if (d <= 0.21 * judgeBoost) {
    if (hitIdx >= noteJudgeIdx) noteJudgeIdx = hitIdx + 1;
    combo++; perfectRun = 0; maxCombo = Math.max(maxCombo, combo);
    runStats.o++;
    score += Math.round((45 + combo * 2) * (feverOn ? 2 : 1) * gimmickMult());
    judgeFlash = 'GOOD';
    window.stageGimmicks?.onJudge('good');
    mission('combo15', combo, true);
    if (!window.cosmiiImpact?.judge('good', px, py, combo)) floats.push({ text: 'GOOD', x: px, y: py, l: 0.8, c: '#bdf' }); if(typeof sfxJudge==='function')sfxJudge('good');
  } else {
    // 判定窓内にノートがないジャンプは無判定(ホールド移動でコンボ・FEVERを壊さない)
  }
}
// ============ Obstacle geometry ============
function rawRects(ob) {
  const def = OBSTACLES[ob.type], d = ob.t - songPos;
  const cx = player.x + B/2 + (def?.offset ? def.offset(ob, d) : d * SPEED);
  const f = inFlipT(ob.t);              // 反転ゾーン内の障害物は天井側に付く
  const gy = f ? CEIL : GROUND - B;     // 障害物が占める1マス帯の上端
  return def ? def.parts(cx, gy, f, ob, d) : { spikes: [], blocks: [] };
}
// ob.mir: a stage gimmick inside a flip zone, built for the floor and mirrored
// onto the ceiling (geometry here, drawing in the draw loop).
const mirRect = r => ({ ...r, y: DH - r.y - r.h, f: true });
function obstacleRects(ob) {
  const p = rawRects(ob);
  if (!ob.mir) return p;
  return { ...p, spikes: p.spikes.map(mirRect), blocks: p.blocks.map(mirRect), hazards: p.hazards?.map(mirRect), pits: undefined };
}

// ============ 更新 ============
let prevT = performance.now();
let lastMediaPos = -99, mediaStall = 0;
function update(dt, frameSongPos = null) {
  if (state !== 'play' && state !== 'dead') return;
  if (state === 'play' && countdown) return;

  if (state === 'play') {
    let pos = frameSongPos === null ? musicPosition() : frameSongPos;
    // Never stop short of the goal: if the music ends or stalls in the last
    // seconds, keep the run going on the frame clock until the goal.
    if (frameSongPos === null) {
      if (pos > lastMediaPos + 1e-4 || pos < lastMediaPos - 1) { lastMediaPos = pos; mediaStall = 0; } else mediaStall += dt;
      if (songPos > duration - 4 && (mediaStall > 0.2 || window.musicEnded?.())) pos = Math.max(pos, songPos + dt);
    }
    songPos = pos;
    while (beatIdx < beats.length && beats[beatIdx].t <= songPos) {
      pulse = 1; beatIdx++;
      // Beat timing remains active; no continuous visual pulse around the player.
    }
    const missWindow = 0.21 * (skinEffect('judge') ? 1.18 : 1);
    while (noteJudgeIdx < level.length && level[noteJudgeIdx].t-TAP_OFFSET < songPos-missWindow) {
      if (!judgedNotes.has(noteJudgeIdx)) {
        judgedNotes.add(noteJudgeIdx);combo=0;perfectRun=0;
        floats.push({text:'MISS',x:player.x+B/2,y:player.y-14,l:0.6,c:'#ff8fae'});if(typeof sfxJudge==='function')sfxJudge('miss');
        window.stageGimmicks?.onJudge('miss');
        if (state !== 'play') return;   // a gimmick may end the run on a miss
      }
      noteJudgeIdx++;
    }
    // 重力方向(反転ゾーン)
    const gdir = inFlipT(songPos) ? -1 : 1;
    if (gdir !== lastGdir) {
      lastGdir = gdir;
      player.grounded = false; player.vy = 0;
      floats.push({ text: 'FLIP!', x: player.x + B/2, y: DH/2, l: 1.1, c: '#8ff' });
      rings.push({ r: B, a: 0.5 });
      if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }
    }
    const now = performance.now()/1000;
    // A gimmick (e.g. riding a cannon) can take over the player for a while;
    // judging, coins, near-miss and the clear check still run.
    const owned = window.stageGimmicks?.ownsPlayer(dt, now) === true;
    if (!owned) {
    // ジャンプ / 空中オーブ
    // A tap is remembered for JUMP_BUFFER, so a tap made just before landing
    // still jumps (an ordinary 0.1s touch also lengthens the jump through hold).
    // Just after walking off a ledge (not after a jump) a tap still jumps.
    const canJump = player.grounded || now - offLedgeAt < COYOTE;
    if (canJump && (isDown || now - tapAt < JUMP_BUFFER)) {
      player.vy = -V0 * gdir; player.grounded = false; tapAt = -9; offLedgeAt = -9;
      holdJump = HOLD_MAX * (skinEffect('hold') ? 1.22 : 1);
      window.cosmiiCharacterMotion?.emit('jump');
      judge();
    } else if (!player.grounded && (isDown || now - tapAt < 0.12)) {
      for (const orb of orbsLive) {
        if (orb.used) continue;
        const odx = (orb.t - songPos) * SPEED;
        if (Math.abs(odx) > 30 || Math.abs(player.y + B/2 - orb.y) > 42) continue;
        orb.used = true; collectedOrbs.add(orb.t); tapAt = -9;
        player.vy = -V0 * 0.9 * gdir; holdJump = HOLD_MAX * 0.6;
        combo++; perfectRun++; maxCombo = Math.max(maxCombo, combo);
        score += Math.round((150 + combo * 5) * (feverOn ? 2 : 1) * (skinEffect('score') ? 1.1 : 1) * gimmickMult());
        judgeFlash = 'ORB';
        mission('orb5', 1); mission('combo15', combo, true);
        floats.push({ text: 'ORB!', x: player.x + B/2, y: player.y - 14, l: 1, c: '#ffb14a' });
        rings.push({ r: B*0.6, a: 0.6 });
        sfxOrb();
        break;
      }
    }
    // 物理
    const prevBottom = player.y + B, prevTop = player.y;
    if (!player.grounded) {
      const holding = isDown && player.vy * gdir < 0 && holdJump > 0;
      const holdGrav = skinEffect('hold') ? HOLD_GRAV * 0.88 : HOLD_GRAV;
      if(holding&&skinEffect('hold'))window.beatPSF?.skill('hold');
      player.vy += GRAV * gdir * (holding ? holdGrav : 1) * dt;
      if(holding) window.cosmiiCharacterMotion?.emit('hold');
      holdJump = Math.max(0, holdJump - dt);
      player.y += player.vy * dt;
      player.rot = 0;
    }
    // 接地(通常=地面/ブロック上面、反転中=天井/ブロック下面)
    const pl = player.x + 4, pr = player.x + B - 4;
    if (gdir === 1) {
      let floorY = GROUND;
      for (const ob of level) {
        if (!obNear(ob, 1.5)) continue;
        for (const bl of obstacleRects(ob).blocks) {
          if (bl.f) continue;
          if (pr > bl.x && pl < bl.x + bl.w && prevBottom <= bl.y + 6) floorY = Math.min(floorY, bl.y);
        }
      }
      if (!player.grounded && player.vy >= 0 && player.y + B >= floorY) {
        player.y = floorY - B; player.vy = 0; player.grounded = true;
        player.rot = 0;
        landAt = now;
      }
      // A floor that rose a little under the player (moving platform) carries it up.
      if (player.grounded && player.y + B > floorY && player.y + B - floorY <= 8) player.y = floorY - B;
      // Walking off any ledge starts a fall, including onto a lower block.
      if (player.grounded && player.y + B < floorY - 1) { player.grounded = false; offLedgeAt = now; }
    } else {
      let ceilY = CEIL;
      for (const ob of level) {
        if (!obNear(ob, 1.5)) continue;
        for (const bl of obstacleRects(ob).blocks) {
          if (!bl.f) continue;
          if (pr > bl.x && pl < bl.x + bl.w && prevTop >= bl.y + bl.h - 6) ceilY = Math.max(ceilY, bl.y + bl.h);
        }
      }
      if (!player.grounded && player.vy <= 0 && player.y <= ceilY) {
        player.y = ceilY; player.vy = 0; player.grounded = true;
        player.rot = 0;
        landAt = now;
      }
      if (player.grounded && player.y > ceilY + 1) { player.grounded = false; offLedgeAt = now; }
    }
    // 衝突
    const hx = player.x + B*0.2, hw = B*0.6, hy = player.y + B*0.2, hh = B*0.6;
    let hit = false, hitOb = null, hitPart = '';
    const pcx = player.x + B/2, onFloor = gdir === 1 && player.y + B >= GROUND - 1;
    for (const ob of feverProtected() ? [] : level) {
      if (!obNear(ob, 1.5)) continue;
      const parts = obstacleRects(ob);
      if (parts.hazards) for (const z of parts.hazards) {
        if (hx < z.x + z.w && hx + hw > z.x && hy < z.y + z.h && hy + hh > z.y) { hit = true; hitPart = 'hazard'; break; }
      }
      if (!hit && onFloor && parts.pits) for (const pit of parts.pits) {
        if (pcx > pit.x && pcx < pit.x + pit.w) { hit = true; hitPart = 'pit'; break; }
      }
      for (const s of parts.spikes) {
        const sx = s.x + s.w*0.36, sw = s.w*0.28;
        const sy = s.y + (s.f ? 0 : s.h*0.4), sh = s.h*0.6;
        if (hx < sx+sw && hx+hw > sx && hy < sy+sh && hy+hh > sy) { hit = true; hitPart = 'spike'; break; }
      }
      if (!hit) for (const bl of parts.blocks) {
        if (bl.oneWay) continue;   // pass-through from below and the sides; land from above
        if (player.x + B - 5 > bl.x && player.x + 5 < bl.x + bl.w &&
            (bl.f ? (player.y < bl.y + bl.h - 9 && player.y + B > bl.y)
                  : (player.y + B > bl.y + 9 && player.y < bl.y + bl.h))) { hit = true; hitPart = 'block'; break; }
      }
      if (hit) { hitOb = ob; break; }
    }
    // A shield or the post-revive grace keeps the run going: only stop this
    // step if the hit actually ended it, so coins, effects and the clear check
    // keep running while the player is protected inside an obstacle.
    if (hit) { die({ ob: hitOb, part: hitPart }); if (state !== 'play') return; }
    }
    // コイン取得
    for (const c of coinsLive) {
      if (c.got) continue;
      const dx = (c.t - songPos) * SPEED;
      if (dx > W || dx < -W * 0.5) continue;
      const ccx = player.x + B/2 + dx;
      const nx = Math.max(player.x, Math.min(ccx, player.x + B));
      const ny = Math.max(player.y, Math.min(c.y, player.y + B));
      const coinRadius = 14 * (skinEffect('coin') ? 1.4 : 1);
      if ((ccx-nx)*(ccx-nx) + (c.y-ny)*(c.y-ny) < coinRadius*coinRadius) {
        if(skinEffect('coin')&&((ccx-nx)**2+(c.y-ny)**2>=14**2||c.risky))window.beatPSF?.skill('coin');
        const gained = (c.risky ? 2 : 1) * (feverOn ? 2 : 1) * gimmickMult();
        c.got = true; coinRun += gained;
        window.cosmiiCharacterMotion?.emit('coin',ccx,c.y);
        window.stageGimmicks?.onCoin?.();
        window.cosmiiPower?.collect(gained);
        mission('coins30', gained);
        if (c.risky) { score += (skinEffect('coin') ? 180 : 120) * (feverOn ? 2 : 1); mission('risky5', 1); }
        sfxCoin();
        for (let i = 0; i < 6; i++) {
          const a = Math.random()*Math.PI*2, v = 40 + Math.random()*90;
          particles.push({ x: ccx, y: c.y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 60,
            s: 3, l: 0.6, hue: 50 });
        }
      }
    }
    // ニアミスボーナス
    while (nearIdx < level.length && level[nearIdx].t <= songPos) {
      const ob = level[nearIdx++];
      if (OBSTACLES[ob.type]?.nearMiss) {
        const f = inFlipT(ob.t);
        const clearance = f ? (player.y - (CEIL + B)) : ((GROUND - B) - (player.y + B));
        if (clearance > -2 && clearance < 13 && !awardedNear.has(nearIdx-1)) {   // トゲすれすれ通過
          awardedNear.add(nearIdx-1);
          score += Math.round(60 * (feverOn ? 2 : 1));
          floats.push({ text: 'NEAR!', x: player.x + B/2, y: player.y - 26, l: 0.9, c: '#9ff' });
        }
      }
    }
    // FEVER TIME: メーター満タンで発動、7秒間スコア・コイン2倍
    if (feverOn) {
      fever = Math.max(0, (feverEnd - songPos) / feverLength);
      if (songPos >= feverEnd) {
        feverGraceUntil = performance.now() / 1000 + 1;
        feverOn = false; fever = 0;
      }
    }
    if (!practice) mission('score3k', score, true);
    if (songPos >= duration) { clearStage(); return; }
  }

  if (state === 'dead') {
    // コンティニュー提示中は待ち時間を延長してカウントダウン表示
    // The revive offer waits 5 s (after a 0.6 s look at the burst) so nobody has to rush.
    const wait = reviveOffered ? REVIVE_SHOW + REVIVE_WAIT : 1100;
    if (reviveOffered) showRevive(performance.now() - deadAt);
    if (performance.now() - deadAt > wait) {
      reviveOffered = false; $('revivebtn').style.display = 'none'; hideRevive();
      if (dailyMode()) {
        // デイリーは自動リスタートで回数を消費しない: タップ待ちのreadyへ
        if (dailyTriesLeft() > 0) {
          state = 'ready'; songPos = -LEAD; attemptOffset = 0;
          lastGdir = 1; player.y = GROUND - B; player.vy = 0; player.rot = 0; player.grounded = true;
          particles = [];
        } else { backToMenu(); toast('DAILY 0/3'); }
      } else startAttempt(0);
    }
  }

  pulse *= Math.exp(-6 * dt);
  shake *= Math.exp(-7 * dt);
  for (const p of particles) { p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 800*dt; p.l -= dt*1.2; }
  particles = particles.filter(p => p.l > 0);
  for (const f of floats) { f.y -= 28*dt; f.l -= dt*1.1; }
  floats = floats.filter(f => f.l > 0);
  for (const r of rings) { r.r += 170*dt; r.a -= dt*1.1; }
  rings = rings.filter(r => r.a > 0);
}

// ============ 描画 ============
// FEVER/POWER is switched off by cosmiiPower.enabled (cosmii-power.js); this
// is the only way it starts, so the one flag turns the whole feature on or off.
function activateFever(seconds = 10) {
  if (!window.cosmiiPower?.enabled || feverOn || state !== 'play') return;
  feverLength = seconds;
  feverOn = true; feverEnd = songPos + seconds; fever = 1;
  if (!window.cosmiiImpact?.fever()) floats.push({ text: 'FEVER TIME!!', x: player.x + B/2, y: DH*0.35, l: 1.6, c: '#ff7ad9' });
  rings.push({ r: B, a: 0.8 });
  sfxFever();
}

function drawPlayerArt(image, pose, size) {
  if (window.cosmiiWardrobe) window.cosmiiWardrobe.draw(ctx, skinIdx, pose, image, -size/2, -size/2, size, size);
  else ctx.drawImage(image,-size/2,-size/2,size,size);
}
function draw() {
  if(window.reducedEffects){shake=0;particles.length=0;rings.length=0;confetti.length=0;}
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  const hue = STAGES[stageIdx].hue;
  const inGame = state === 'ready' || state === 'play' || state === 'paused' || state === 'dead';

  // A stage world (Rescue, Cannon, ...) paints its own scenery; Rhythm Dash
  // stages, menus and the tutorial keep the original artwork.
  const skin = window.worldSkins?.current(inGame || state === 'clear');
  const worldArtwork = window.cosmiiWorld?.background(!!skin);
  ctx.clearRect(0, 0, W, DH);
  if (skin) window.worldSkins.drawBackground(ctx, skin);
  else window.worldSkins?.hideLayer();
  if (!skin && !worldArtwork) {
  const gBg = ctx.createLinearGradient(0, 0, 0, DH);
  gBg.addColorStop(0, `hsl(${hue + fever*35},${60 + fever*18}%,${14 + fever*5}%)`);
  gBg.addColorStop(1, `hsl(${hue+30 + fever*50},${65 + fever*15}%,${26 + fever*7}%)`);
  ctx.fillStyle = gBg; ctx.fillRect(0, 0, W, DH);
  if (inGame) window.cosmiiPower?.drawBackground(ctx);

  const scroll = (songPos + LEAD) * SPEED;
  ctx.save();
  ctx.globalAlpha = 0.08; ctx.fillStyle = '#fff';

    songPos += dt;
    const now = performance.now()/1000;
    if (player.grounded && (isDown || now - tapAt < 0.1)) { player.vy = -V0; player.grounded = false; tapAt = -9; }
    if (!player.grounded) { player.vy += GRAV*dt; player.y += player.vy*dt; player.rot = 0; }
    if (!player.grounded && player.vy >= 0 && player.y + B >= GROUND) { player.y = GROUND-B; player.vy = 0; player.grounded = true; }
  } else {
    if(state==='play'){
      let target;
      if(countdown){
        countdown.elapsed=Math.min(COUNT_SEC,(performance.now()-countdown.t0)/1000);
        target=-LEAD;isDown=false;tapAt=-9;
        if(countdown.elapsed>=COUNT_SEC){countdown=null;playTrack(0,LEAD,true);}
      }else target=musicPosition();
      const elapsed=Math.max(0,target-songPos);
      // Advance physics and scrolling together, including ordinary dropped frames.
      const steps=Math.max(1,Math.min(60,Math.ceil(elapsed/0.02)));
      const from=songPos;
      for(let i=1;i<=steps&&state==='play';i++)update(Math.min(elapsed/steps,1/30),from+(target-from)*i/steps);
    }else if(state==='clear')goalStep(dt);
    else update(dt);
  }
  window.cosmiiPower?.tick();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ============ ログインボーナス ============
function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function checkLoginBonus() {
  const today = new Date(), key = dateKey(today);
  if (localStorage.getItem('rdash_login_last') === key) return;
  const yest = new Date(today); yest.setDate(yest.getDate() - 1);
  const cont = localStorage.getItem('rdash_login_last') === dateKey(yest);
  const streak = cont ? +(localStorage.getItem('rdash_login_streak') || 0) + 1 : 1;
  const reward = n => Math.min(20 + (n - 1) * 10, 100);
  const bonus = reward(streak);
  // 7-day calendar: days already claimed are ✓, today glows, later days show what is coming.
  const first = Math.floor((streak - 1) / 7) * 7 + 1;
  $('loginstreak').textContent = streak;
  $('logininfo').innerHTML = Array.from({ length: 7 }, (_, i) => {
    const d = first + i, v = reward(d), cls = d < streak ? 'got' : d === streak ? 'today' : '';
    return `<div class="login-day ${cls}" aria-label="${d}日目 ${v}コイン${d < streak ? '・受け取り済み' : d === streak ? '・今日' : ''}">${d === streak ? '<span class="login-tag">TODAY</span>' : ''}<span class="login-d">DAY ${d}</span><img src="Asset/cosmo-coin.png" alt=""><b>+${v}</b>${v === 100 && reward(d - 1) < 100 ? '<span class="login-max">MAX</span>' : ''}</div>`;
  }).join('');
  $('loginnext').innerHTML = `あしたは <b>+${reward(streak + 1)}</b>`;
  $('loginclaim').onclick = () => {
    addCoins(bonus);
    gaCoins('Source', bonus, 'Bonus', 'Login');
    gaDesign('Bonus:Login', bonus);
    localStorage.setItem('rdash_login_last', key);
    localStorage.setItem('rdash_login_streak', streak);
    $('loginov').style.display = 'none';
    toast(`+${bonus}`);
    refreshMenu();
  };
  $('loginov').style.display = 'flex';
}
if (!DEMO && bootDone) checkLoginBonus();
